{{ define "main" }}
<style>
.post-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 48px 24px;
  min-height: calc(100vh - 200px);
}
.post-wrap h1 {
  font-size: 2rem;
  font-weight: 700;
  margin: 0 0 8px 0;
}
.post-meta {
  font-size: 0.85rem;
  opacity: 0.5;
  margin: 0 0 40px 0;
}
</style>

<div class="post-wrap">
  <h1>{{ .Title }}</h1>
  <p class="post-meta">{{ .Date.Format "January 2, 2006" }}
    {{ with .Params.tags }}· {{ range . }}<span style="margin-right:6px;">#{{ . }}</span>{{ end }}{{ end }}
  </p>
  {{ .Content }}
</div>
{{ end }}
